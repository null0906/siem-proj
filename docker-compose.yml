services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seccomply}
      POSTGRES_USER: ${POSTGRES_USER:-seccomply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seccomply}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seccomply}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seccomply}:${POSTGRES_PASSWORD:-seccomply}@db:5432/${POSTGRES_DB:-seccomply}?sslmode=disable
      PORT: "8080"
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - internal
      - external

  ingestor:
    build:
      context: .
      dockerfile: .docker/Dockerfile.ingestor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seccomply}:${POSTGRES_PASSWORD:-seccomply}@db:5432/${POSTGRES_DB:-seccomply}?sslmode=disable
      WATCH_DIR: /data/inbox
    volumes:
      - inbox_data:/data
    networks:
      - internal

  seed:
    image: golang:1.22-alpine
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seccomply}:${POSTGRES_PASSWORD:-seccomply}@db:5432/${POSTGRES_DB:-seccomply}?sslmode=disable
    volumes:
      - .:/src
    command: sh -c "go run ./scripts/seed"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3001}:3000"
    networks:
      - external

volumes:
  pg_data:
  inbox_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
